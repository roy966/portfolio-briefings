s for itself, and Google has the longest head start.","key_points":["The ASIC segment is growing at a 35% CAGR and will need 90GW of data center capacity by 2030 (financial).","A leading-edge custom chip costs $500M+ in design, IP licensing, and tape-out before a single unit ships — the math only works at hyperscaler volume (financial).","Google has built TPUs the longest and has the most mature hyperscaler ASIC in production (tech).","Meta signed a multibillion-dollar deal in February to lease Google's TPUs, with talks underway to install them in Meta's own data centers starting 2027 (financial)."],"sector":"Horizontal SW","sub_sector":"Cloud","owners":["or"],"plc_roy":[],"plc_or":[["Horizontal SW","Cloud"]]},{"post_id":"ms-asic-0718","scope":"company","company":"Meta","title":"ASIC","url":"https://www.marketsentiment.co/p/asic","publication":"Market Sentiment","source":"RSS","published_at":"2026-07-18 14:18","created_at":"2026-07-23 11:35","sentiment":"neutral","analysis":"Meta is the newest hyperscaler entrant into custom ASICs, running its MTIA chips for internal inference while also leasing Google's TPUs as a hedge.","opinion":"Author: even Meta, the newest entrant, is hedging in-house silicon with leased TPU capacity rather than betting solely on its own chips.","key_points":["Meta's MTIA chips already run recommendation inference internally (tech).","In February, Meta signed a multibillion-dollar deal to lease Google's TPUs, with talks underway to install them in Meta's own data centers from 2027 (financial)."],"sector":"Vertical SW","sub_sector":"Social Media","owners":["or"],"plc_roy":[],"plc_or":[["Vertical SW","Social Media"]]},{"post_id":"rh-asymcyber-0722","scope":"macro","company":"","title":"Asymmetric Cyber Warfare is Here","url":"https://reidhoffman.substack.com/p/asymmetric-cyber-warfare-is-here","publication":"Theory of the Game","source":"RSS","published_at":"2026-07-22 16:03","created_at":"2026-07-23 11:35","sentiment":"negative","analysis":"AI is lowering the cost of finding and exploiting over-provisioned machine access, widening the gap between how much access companies grant and how much they actually need.","opinion":"Reid Hoffman: over-permissioned machine identity combined with AI-lowered attack costs is the area of cyber risk he worries about most.","key_points":["CyberArk reports machine identities now outnumber humans by more than 80-to-1, with about half holding privileged access (market).","Microsoft's research on cloud permissions found a substantial share of granted access goes unused (tech).","Verizon found 88% of basic web-application attacks rely on stolen credentials (market).","Comparable offensive capabilities to closed frontier models are achievable with open-weight models plus an adequate harness, lowering the barrier to exploit over-grants (tech)."],"sector":"Pure Cyber","sub_sector":"Identity","owners":["or"],"plc_roy":[],"plc_or":[]},{"post_id":"sv-chinacompute-0723","scope":"sector","company":"","title":"China's AI Models Are Catching Up—But Its Compute Gap Is Getting Worse","url":"https://tspasemiconductor.substack.com/p/chinas-ai-models-are-catching-upbut","publication":"SEMIVISION @_@","source":"RSS","published_at":"2026-07-23 03:59","created_at":"2026-07-23 11:35","sentiment":"mixed","analysis":"Chinese AI model quality is closing the gap with the US even as China's effective (not just nominal) compute capacity gap widens due to networking, cooling, and power bottlenecks.","opinion":"Author: model catch-up is real, but it doesn't eliminate China's compute problem — inference efficiency gains can't fully substitute for the infrastructure bottleneck.","key_points":["Real-world AI cluster performance depends on networking efficiency, software compatibility, memory constraints, hardware reliability, cluster scheduling, and workload utilization — not just installed GPU count (tech).","Two AI clusters with identical theoretical teraFLOPS can deliver dramatically different real-world compute output because of these bottlenecks (tech).","Chinese AI developers have become highly skilled at inference efficiency even as the underlying compute gap with the US widens (tech)."],"sector":"Semis & HW","sub_sector":"","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"sv-chinabattlefield-0720","scope":"macro","company":"","title":"China Has Not Won the Chip War—But It Is Changing the Battlefield","url":"https://tspasemiconductor.substack.com/p/china-has-not-won-the-chip-warbut","publication":"SEMIVISION @_@","source":"RSS","published_at":"2026-07-20 14:08","created_at":"2026-07-23 11:35","sentiment":"mixed","analysis":"The economic center of gravity in chips is shifting from individual dies to integrated systems, making packaging and test — where China is investing heavily — strategic rather than secondary.","opinion":"Author: China isn't replacing the global semiconductor ecosystem, but it's becoming increasingly hard to displace from high-volume mid-tier layers like packaging and test.","key_points":["SEMI expects test equipment sales to rise 31% to $15.3B in 2026; assembly and packaging equipment sales to rise 9.6% to $6.7B (financial).","By 2028, those two markets are expected to reach $20.8B and $8.6B respectively (financial).","AI processors can't be commercialized through wafer fabrication alone — they require advanced packaging, high-density substrates, HBM integration, thermal interfaces, burn-in, final test, power delivery, optical connectivity, and server-level assembly (tech)."],"sector":"Semis & HW","sub_sector":"OSAT (Packaging & Test)","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"sv-beyondhbm-0724","scope":"company","company":"Samsung Electronics Co., Ltd.","title":"Beyond HBM: Samsung Targets the Next AI Battleground with Advanced Packaging and CPO","url":"https://tspasemiconductor.substack.com/p/beyond-hbm-samsung-targets-the-next","publication":"SEMIVISION","source":"RSS","published_at":"2026-07-24 00:49","created_at":"2026-07-24 14:10","sentiment":"neutral","analysis":"SEMIVISION profiles Samsung's pivot toward advanced packaging, silicon photonics and co-packaged optics (CPO) as it builds toward an LPU inference-foundry business.","opinion":"SEMIVISION: Samsung is positioning packaging and photonics -- not just memory -- as its next AI battleground as inference scales past training.","key_points":["Samsung's strategy combines advanced packaging, silicon photonics, and CPO to build an LPU inference-foundry business and a broader AI infrastructure platform (tech).","Piece cites Groq's LPU and NVIDIA's Rubin + LPX architecture (unveiled at GTC 2026) as evidence the inference-accelerator market is expanding fast enough to potentially surpass training (tech/market).","Optical interconnects and CPO are moving from lab prototypes to commercial deployment as data movement and I/O power -- not raw compute -- increasingly gate system efficiency (tech)."],"sector":"Semis & HW","sub_sector":"OSAT (Packaging & Test)","owners":["roy"],"plc_roy":[["Semis & HW","OSAT (Packaging & Test)"]],"plc_or":[]},{"post_id":"sv-beyondhbm-0724","scope":"macro","company":"","title":"Beyond HBM: Samsung Targets the Next AI Battleground with Advanced Packaging and CPO","url":"https://tspasemiconductor.substack.com/p/beyond-hbm-samsung-targets-the-next","publication":"SEMIVISION","source":"RSS","published_at":"2026-07-24 00:49","created_at":"2026-07-24 14:10","sentiment":"neutral","analysis":"Inference workloads are shifting the system bottleneck from compute to data movement, pulling optical interconnects and CPO into the mainstream chip roadmap.","opinion":"Author: as inference scales, whoever controls packaging and photonics economics captures more AI-infra value than raw compute alone.","key_points":["GPUs and HBM deliver training-era floating-point performance, but in deployed inference servers data movement and I/O power increasingly determine total system efficiency (tech).","Silicon photonics integrates optical components into wafer-scale manufacturing to move signals at light speed with lower energy versus copper interconnects (tech)."],"sector":"Semis & HW","sub_sector":"Semiconductors","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"nc-besibonders-0722","scope":"company","company":"Samsung Electronics Co., Ltd.","title":"Why Samsung Hasn't Signed a Deal for 50 Besi Hybrid Bonders","url":"https://nuttycld.substack.com/p/why-samsung-hasnt-signed-a-deal-for","publication":"Nutty","source":"RSS","published_at":"2026-07-22 13:02","created_at":"2026-07-24 14:10","sentiment":"mixed","analysis":"Piece examines why Samsung hasn't committed to a large Besi hybrid-bonder order despite NVIDIA's escalating HBM packaging roadmap.","opinion":"Nutty: the timing gap signals Samsung is waiting on NVIDIA's Rubin Ultra/Feynman roadmap and custom-HBM design wins before committing hybrid-bonding capex.","key_points":["NVIDIA's Rubin Ultra, on the public roadmap for 2H 2027, is set to carry roughly a terabyte of memory per package (tech).","The current HBM standard maxes out at 64GB per stack across 16 layers, so reaching 1TB would require 16 fully-populated stacks on a single package (tech).","The following generation, Feynman (2028), is slated to stack compute GPU dies in 3D and move to customer-specific memory design (cHBM) (tech).","Samsung's HBM4 base die is already built on its own 4-nanometer foundry node, with custom HBM redesigning that base die per customer (tech)."],"sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[["Semis & HW","Memory"]],"plc_or":[]},{"post_id":"nc-besibonders-0722","scope":"company","company":"BE Semiconductor Industries N.V.","title":"Why Samsung Hasn't Signed a Deal for 50 Besi Hybrid Bonders","url":"https://nuttycld.substack.com/p/why-samsung-hasnt-signed-a-deal-for","publication":"Nutty","source":"RSS","published_at":"2026-07-22 13:02","created_at":"2026-07-24 14:10","sentiment":"mixed","analysis":"Samsung has not yet signed for roughly 50 Besi hybrid-bonding tools despite the scale of HBM stacking implied by NVIDIA's packaging roadmap.","opinion":"Nutty: the order timing reflects real uncertainty over Samsung's packaging roadmap commitments, not weak underlying hybrid-bonding demand.","key_points":["A roughly 50-unit hybrid-bonder order from Samsung is the deal in question, tied directly to the HBM-stacking math needed for Rubin Ultra-class packages (financial/tech).","Next-gen Feynman packages (2028), which require 3D-stacked compute dies, would further raise hybrid-bonding tool intensity per package (tech)."],"sector":"Semis & HW","sub_sector":"Semicap Equipment","owners":["roy"],"plc_roy":[["Semis & HW","Semicap Equipment"]],"plc_or":[]},{"post_id":"tf-memhierarchy-0722","scope":"macro","company":"","title":"From Training to Inference: A Paradigm Shift in the Memory Hierarchy","url":"https://insights.trendforce.com/p/memory-hierarchy-paradigm-shift","publication":"TrendForce","source":"RSS","published_at":"2026-07-22 04:00","created_at":"2026-07-24 14:10","sentiment":"neutral","analysis":"TrendForce frames HBM as a new tier in the memory hierarchy created specifically by AI training, now being reshaped by inference's different bandwidth and latency needs.","opinion":"TrendForce: the memory hierarchy gained a permanent new tier (HBM) in the training era, and inference is now reshaping how that tier gets used.","key_points":["A single HBM stack delivers more than 2 TB/s of bandwidth; HBM4 offers over 1 GB/s per pin across 2,048 pins (tech).","HBM sits side-by-side with the compute die on the same interposer, versus PCIe 6.0 x16's 128 GB/s over a longer data path (tech).","Inference splits into a parallel, compute-heavy prefill stage and a sequential, memory-bandwidth-heavy decode stage, each stressing the memory hierarchy differently (tech)."],"sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"cb-sixplaces-0723","scope":"sector","company":"","title":"Six Places to Build. Everything Else Is a Commodity.","url":"https://cyberbuilders.substack.com/p/six-places-to-build-everything-else","publication":"Cyber Builders","source":"RSS","published_at":"2026-07-23 11:55","created_at":"2026-07-24 14:10","sentiment":"neutral","analysis":"Cyber Builders lays out six areas where cybersecurity still has real building room, arguing most else is becoming commoditized.","opinion":"Hausermann: the moat left in cyber is pairing automation with accountability -- AI-enabled services and 'frontier security' are where builders should focus next.","key_points":["Argues AI collapses the cost of expert-heavy security work (MDR, red-teaming, compliance ops), enabling a new 'AI-native expert service delivery' company category (tech/market).","Frames 'frontier security' -- securing the new AI-driven attack surface itself -- as a fresh category created by the current technology shift (market).","Notes most agent demos fail to reach unsupervised production reliability ('few can deploy one that works safely at 3am'), keeping human accountability as the differentiator (tech)."],"sector":"Pure Cyber","sub_sector":"","owners":["or"],"plc_roy":[],"plc_or":[]},{"post_id":"sacr-ecp-0722","scope":"macro","company":"","title":"The CISO Guide to Endpoint Control and Prevention (ECP): The Next Architecture for Endpoint Security","url":"https://softwareanalyst.substack.com/p/the-ciso-guide-to-endpoint-control","publication":"Software Analyst Cyber Research","source":"RSS","published_at":"2026-07-22 16:02","created_at":"2026-07-24 14:10","sentiment":"neutral","analysis":"SACR argues traditional EDR only sees post-execution malicious processes, missing the application-layer and agent activity that now defines endpoint risk.","opinion":"SACR: Endpoint Control and Prevention (ECP) is a new architectural category set to define the next decade of endpoint security, beyond EDR.","key_points":["Endpoints have shifted from OS-governed devices to where people, AI agents, applications and data intersect, requiring governance of the interaction itself rather than post-hoc review (tech).","ECP is positioned to expand endpoint security into a runtime control plane governing AI agents, browser activity, app workflows, identity context and sensitive data before an attack completes (tech).","SACR flags an 'explosion' of vendors already building toward this category, signaling the market is moving from concept to competitive land-grab (market)."],"sector":"Pure Cyber","sub_sector":"Endpoint","owners":["or"],"plc_roy":[],"plc_or":[]},{"post_id":"a16z-atoms-travis-0722","scope":"sector","company":"","title":"Travis is Back","url":"https://www.a16z.news/p/travis-is-back","publication":"a16z","source":"RSS","published_at":"2026-07-22 18:35","created_at":"2026-07-24 14:10","sentiment":"positive","analysis":"Ben Horowitz's post marks Travis Kalanick's re-emergence at a16z's ATOMS physical-AI fund, framing robotics as the next 'atoms-heavy' industry disruption.","opinion":"Horowitz: physical AI/robotics is the next platform shift on the scale of Uber's digitization of transportation, and Kalanick is positioned to lead it.","key_points":["Frames robotics applied to 'atoms-heavy' industries as the emerging platform category a16z is backing via its ATOMS initiative (market/tech).","Draws a direct parallel to Uber's software-for-the-physical-world model as the template for the coming robotics wave (context)."],"sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"a16z-atoms-unfinished-0722","scope":"sector","company":"","title":"Unfinished Business","url":"https://www.a16z.news/p/unfinished-business","publication":"a16z","source":"RSS","published_at":"2026-07-22 18:33","created_at":"2026-07-24 14:10","sentiment":"positive","analysis":"Kalanick's own post connects a16z's 'Bits to Atoms' thesis (CPU as manufacturing, storage as real estate, network as transportation) to the newly launched ATOMS fund.","opinion":"Kalanick: physical AI is a 16-year thesis now reaching its 'loud' phase after ATOMS' stealth build-up drew heavy investor interest.","key_points":["ATOMS launched a few months prior to this post and drew a 'huge amount of interest' after years of stealth development (market).","Thesis frames CPU as manufacturing, storage as real estate, and network as transportation for a physical-world computing stack, following the earlier Uber and Cloud Kitchens playbooks (tech/context)."],"sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"euclid-openweight-0723","scope":"sector","company":"","title":"The Open-Weight Unbundling","url":"https://insights.euclid.vc/p/the-open-weight-unbundling-jake-saper-emergence-capital","publication":"The Verticalist","source":"RSS","published_at":"2026-07-23 14:32","created_at":"2026-07-24 14:10","sentiment":"mixed","analysis":"Euclid Ventures argues frontier AI labs face commodity pressure from open-weight models and may push 'up the stack' into vertical applications, competing directly with their own SaaS/API customers.","opinion":"Saper/Euclid: labs moving vertical to escape margin pressure creates a self-reinforcing loop that pushes customers further toward open source -- a bearish read for labs' vertical ambitions.","key_points":["Names Veeva, Fair Isaac (FICO) and Epic as vertical incumbents whose moats come from years of workflow depth and first-party data, not just product speed (context).","Frames a self-reinforcing loop: labs go vertical, customers grow warier, the shift accelerates to open source, and core lab margins compress further (market)."],"sector":"Vertical SW","sub_sector":"","owners":["or"],"plc_roy":[],"plc_or":[]},{"post_id":"pc-memwall-0726","scope":"macro","company":"","title":"Three Routes Around the Memory Wall: Qualcomm's Stack, Nvidia's 3 Bits, and What Remains","url":"https://photoncap.net/p/three-routes-around-the-memory-wall","publication":"PhotonCap","source":"RSS","published_at":"2026-07-26 05:52","created_at":"2026-07-26 12:15","sentiment":"neutral","analysis":"PhotonCap audits three ways AI accelerators could bypass the HBM memory wall — distance, compression, and pooling — and what each implies for DRAM makers and the optics timeline.","opinion":"PhotonCap: hyperscalers are lining up behind an approach that would remove HBM from the AI accelerator entirely, a structural threat to the current memory-wall consensus.","key_points":["Three bypass routes audited: distance (Qualcomm's HBC), compression (Nvidia Rubin's 3.125-bit encoding), and pooling — each pushes DRAM makers and the optics timeline differently (tech).","Microsoft's and Meta's CEOs reportedly appeared in the Investor Day program of a company proposing to remove HBM from the AI accelerator altogether (market).","Piece is tagged to $QCOM, $NVDA, $MU, $AMD and $CBRS as the names most exposed to how the memory-wall bypass resolves (financial)."],"sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"peq-aicapex-0725","scope":"sector","company":"","title":"Late Night Thoughts on AI CapEx","url":"https://pequityresearch.substack.com/p/late-night-thoughts-on-ai-capex","publication":"P Equity Research","source":"RSS","published_at":"2026-07-25 03:50","created_at":"2026-07-26 12:15","sentiment":"positive","analysis":"Recaps Jensen Huang's framing that the semiconductor industry must grow 5-10x over the next decade to build the 'intelligence layer,' sizing today's shortages as structural rather than cyclical.","opinion":"Author: takes Jensen Huang's framing at face value — today's memory/packaging/foundry shortages are evidence the industry is still an order of magnitude too small, not proof of a bubble.","key_points":["Jensen Huang: the semiconductor industry needs to be 5-10x larger than today over the next decade to build the AI 'intelligence layer' (market).","WSTS estimates the semiconductor industry at $1.5 trillion in 2026; a 5-10x expansion implies a $7.5-15 trillion industry (financial).","Shortages across memory, storage, optical interconnects, packaging and TSMC foundry capacity are framed as structural infrastructure buildout, not a cyclical up-cycle (tech)."],"sector":"Semis & HW","sub_sector":"","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"tds-notbullish-0724","scope":"macro","company":"","title":"In 2023-2024 We Weren't Bullish Enough","url":"https://www.thediligencestack.com/p/in-2023-2024-we-werent-bullish-enough","publication":"The Diligence Stack - By Creative Strategies","source":"RSS","published_at":"2026-07-24 19:45","created_at":"2026-07-26 12:15","sentiment":"positive","analysis":"Ben Bajarin revisits 2023-24 memory and AI-networking forecasts and finds the firm's own models were still too conservative versus what actually happened.","opinion":"Bajarin: the errors all ran one direction — every forecast underestimated the size of the AI memory and networking buildout, not overestimated it.","key_points":["Late-2023 forecast put 2024 memory revenue at ~$130B; actual sales reached $165B, 27% above the estimate (financial).","A 2024 model projected combined DRAM+NAND revenue at ~$206B for 2025 and ~$214B for both 2026 and 2027 — since revised roughly fourfold higher as AI demand broadened beyond HBM into server DRAM and enterprise NAND (financial).","A June 2023 forecast put 2027 AI-switching revenue at $8.5B; eleven months later that estimate rose 79% to $15.2B (financial).","The firm's broader networking-silicon model now reaches $105B for 2027 (financial).","Thesis: advanced packaging has become part of the AI capacity boundary — a leading-edge wafer only becomes usable AI capacity once packaging joins it with HBM and the rest of the rack (tech)."],"sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"a16z-inference-0723","scope":"macro","company":"","title":"How to Win the Largest Market in AI","url":"https://www.a16z.news/p/how-to-win-the-largest-market-in","publication":"a16z","source":"RSS","published_at":"2026-07-23 15:34","created_at":"2026-07-26 12:15","sentiment":"positive","analysis":"a16z argues AI inference — not training — is the largest emerging compute market, and that its usage-scaling economics favor purpose-built hardware over general-purpose compute.","opinion":"Raghuram: the biggest AI infrastructure prize is winning inference economics, following the same path that pushed hyperscale network traffic from CPUs onto custom switch silicon.","key_points":["Frames training as capex (a one-time, amortizable cost per model) versus inference as opex that scales continuously with usage — every chat query or agent action adds to a running cost (tech).","Cites custom switch chips from companies like Broadcom as the precedent: hyperscaler network traffic shifted from CPUs to purpose-built silicon once the workload became large and stable enough (tech).","General thesis: the more important and stable a workload, the more it justifies hardware built specifically for its shape — applied here to AI inference as the next such workload (market)."],"sector":"Semis & HW","sub_sector":"AI Cloud (Neocloud)","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"nb-optimism203-0724","scope":"macro","company":"","title":"Weekly Dose of Optimism #203","url":"https://www.notboring.co/p/weekly-dose-of-optimism-203","publication":"Not Boring by Packy McCormick","source":"RSS","published_at":"2026-07-24 13:07","created_at":"2026-07-26 12:15","sentiment":"mixed","analysis":"Covers Indian startup Skyroot's Vikram-1 launch and a since-contested comparison of the rocket to Rocket Lab's Electron.","opinion":"McCormick: frames Skyroot's speed as evidence non-US private space programs are closing the gap, part of a broader optimist read on global space competition.","key_points":["Skyroot's Vikram-1: 22 meters tall, carries up to 350kg, three solid stages plus a liquid orbital-adjustment stage with a 3D-printed engine (tech).","Maiden flight delivered customer payloads to a 450km orbit in about fifteen minutes (tech).","A commentator compared Vikram-1's scale to 'the workhorse rocket for a $40 billion company (RocketLab)' — an implied ~$40B market read on Rocket Lab — drawing pushback from other observers who objected to the comparison (financial).","India opened its space sector to private companies in 2020; Skyroot, founded by former ISRO engineers, launched six years later (market)."],"sector":"Emerging Tech","sub_sector":"Space & Satellite","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"rc-nl107-0723","scope":"company","company":"CrowdStrike","title":"Resilient Cyber Newsletter #107","url":"https://www.resilientcyber.io/p/resilient-cyber-newsletter-107","publication":"Resilient Cyber","source":"RSS","published_at":"2026-07-23 12:43","created_at":"2026-07-26 12:15","sentiment":"positive","analysis":"CrowdStrike expanded its partnership with Germany's Schwarz Digits, acquiring XM Cyber's IP while deploying Falcon Exposure Management on a sovereign cloud.","opinion":"Hughes: sovereignty is becoming a recurring buying criterion in Europe, reshaping the vendor landscape around locally-run, locally-governed security stacks.","key_points":["CrowdStrike acquired the IP of XM Cyber — more than 45 patents plus proprietary source code — from Germany's Schwarz Digits as part of an expanded partnership (financial).","XM Cyber continues operating as a standalone business under an IP license from CrowdStrike (market).","The deal deploys CrowdStrike's Falcon Exposure Management on Schwarz's sovereign STACKIT cloud (tech).","CEO George Kurtz frames the deal around organizations globally prioritizing data/security sovereignty without compromising on cybersecurity outcomes (market)."],"sector":"Pure Cyber","sub_sector":"Exposure","owners":["or"],"plc_roy":[],"plc_or":[["Pure Cyber","Exposure"]] s eroding rapidly as China's chip ecosystem matures — a bigger structural risk than near-term AI job-displacement fears.","key_points":["NVIDIA's CUDA software moat is described as \"eroding rapidly\" as China's domestic chip ecosystem improves (tech).","Domestic Chinese chipmakers now have a \"historic opportunity\" as prior ecosystem-compatibility barriers fall (market).","US unemployment holds at 4.2% with no measurable worsening in the most AI-exposed occupations, per Anthropic's Head of Economics Peter McCrory (financial/market)."]},{"post_id":"sv-memhard-0628","scope":"macro","company":"","title":"AI Chips Are Hard. Memory Is Harder.","url":"https://tspasemiconductor.substack.com/p/ai-chips-are-hard-memory-is-harder","publication":"SEMIVISION @_@","source":"RSS","published_at":"2026-06-28 05:47","created_at":"2026-07-26 15:17","sentiment":"neutral","sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[],"analysis":"SEMIVISION argues memory manufacturing — not chip architecture — is becoming AI hardware's harder engineering problem, with HBM the most demanding tier.","opinion":"SEMIVISION: chip design complexity gets the attention, but memory (especially HBM) manufacturing is the tougher and more capacity-constrained problem.","key_points":["3D NAND manufacturing requires hundreds of stacked layers and highly specialized process integration, comparable in difficulty to advanced DRAM/HBM (tech).","Industry division of labor has chip companies focus on architecture, software optimization and workload efficiency while foundries retain manufacturing responsibility (tech).","HBM presents higher manufacturing-consistency and packaging barriers than conventional DRAM and NAND (tech)."]},{"post_id":"pc-fiber-0717","scope":"macro","company":"","title":"InP Makes the Light. Fiber Carries It: Same Cycle, Different Bottleneck","url":"https://photoncap.net/p/inp-makes-the-light-fiber-carries","publication":"PhotonCap","source":"RSS","published_at":"2026-07-17 16:41","created_at":"2026-07-26 15:17","sentiment":"positive","sector":"Semis & HW","sub_sector":"Communications Equipment","owners":["roy"],"plc_roy":[],"plc_or":[],"analysis":"PhotonCap extends its optical-supply-chain thesis to fiber, arguing AI training clusters consume fiber far more intensively than conventional cloud datacenters.","opinion":"PhotonCap: reading the 190GW AI datacenter pipeline purely as chip demand undercounts it — it is also three separate regional fiber supply chains being built out simultaneously.","key_points":["Announced global AI datacenter projects total 190GW, with $5.5T of investment projected through 2030 (financial).","The 190GW pipeline splits into three separate regional supply chains — US, Korea, and China — each served by different fiber/optics factories (market).","AI training clusters build a dedicated back-end fabric with near non-blocking design and a high-speed NIC per GPU, making them far more fiber-intensive than standard cloud east-west traffic (tech)."]},{"post_id":"ds-cyberai-0723","scope":"sector","company":"","title":"Cybersecurity and the Enterprise AI Control Layer","url":"https://www.thediligencestack.com/p/cybersecurity-and-the-enterprise","publication":"The Diligence Stack - By Creative Strategies","source":"RSS","published_at":"2026-07-23 16:12","created_at":"2026-07-26 15:17","sentiment":"neutral","sector":"Pure Cyber","sub_sector":"","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"The Diligence Stack frames cybersecurity as the approval gate for enterprise (and sovereign) AI adoption as capable models proliferate outside organizational and national borders.","opinion":"Bajarin: security is becoming the deciding gate for whether AI systems get to operate inside the enterprise, not a downstream concern bolted on afterward.","key_points":["Persistent AI-driven threats are framed as a standing fact of operating life as capable closed and open models proliferate beyond company and national borders (tech).","The same enterprise-security framework is extended to sovereign nations facing comparable AI-enabled threat exposure (market).","Security is repositioned as the \"approval gate\" determining whether AI tools and systems are allowed to run inside an organization (market)."]},{"post_id":"sacr-deception-0720","scope":"macro","company":"","title":"The Next Evolution of Cyber Deception in SecOps","url":"https://softwareanalyst.substack.com/p/the-next-evolution-of-cyber-deception","publication":"Software Analyst Cyber Research","source":"RSS","published_at":"2026-07-20 16:23","created_at":"2026-07-26 15:17","sentiment":"neutral","sector":"Pure Cyber","sub_sector":"Specialized","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"Software Analyst Cyber Research reviews deception technology's evolution, positioning it as a complementary control alongside detection, identity and runtime protection rather than a replacement.","opinion":"SACR: deception's promise (e.g. Acalvio) is real but the market is early — buyers should demand measurable outcomes and independent validation over vendor claims.","key_points":["Deception platforms (cited example: Acalvio) are positioned as a complementary security control to be evaluated alongside detection, response, identity and runtime protections (tech).","SACR characterizes the deception market as \"early\" and recommends prioritizing measurable operational outcomes and independent validation over vendor claims (market).","Guidance to security leaders: evaluate deception as an architectural capability integrated with existing controls, not a standalone point product (market)."]},{"post_id":"md101-agentgov-0716","scope":"macro","company":"","title":"Connecting Is Not Aligning: The Governance Gap Your Observability Stack Cannot Close","url":"https://moderndata101.substack.com/p/agentic-ai-capability-stack","publication":"Modern Data 101","source":"RSS","published_at":"2026-07-16 13:06","created_at":"2026-07-26 15:17","sentiment":"negative","sector":"Cyber Related","sub_sector":"Observability","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"Modern Data 101 argues today's observability stacks (logs, traces, dashboards) only show what an agent did, not whether the action was authorized — a governance gap that grows more consequential as agentic AI systems act rather than just generate.","opinion":"Verhelst: connecting data (observability) is not the same as aligning it with authority — vendors are selling observability as a stand-in for governance, and it doesn't close the gap.","key_points":["Distinguishes detective vs. preventive controls: observability (logs, traces, metrics) tells you what happened, not whether it was authorized (tech).","Agentic systems act on interpreted instructions rather than executing fixed code, so post-hoc fixes (adequate for traditional software) are insufficient once an agent has already acted (tech).","Warns that vendors are selling observability dashboards as a governance stand-in even though detective monitoring cannot close the authorization gap (market)."]},{"post_id":"lin185-r40-0713","scope":"sector","company":"","title":"Linear #185: Rule of 40 Deep Dive: Why It Still Matters, Public vSaaS R40 Analysis, How/When It WILL Impact You","url":"https://www.newsletter.lukesophinos.com/p/linear-185-the-rule-of-40-deep-dive","publication":"Linear: A Vertical Software & Vertical AI Newsletter","source":"RSS","published_at":"2026-07-13 00:03","created_at":"2026-07-26 15:17","sentiment":"mixed","sector":"Vertical SW","sub_sector":"","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"Linear's Rule of 40 deep dive on public vertical SaaS shows a wide margin spread between regulated, high-retention verticals and lower-touch consumer-adjacent ones.","opinion":"Sophinos: growth is a choice until it isn't — sub-15% growth without $100M ARR signals under-penetration risk, not business maturity.","key_points":["A handful of public vertical SaaS companies still g ious human-set record (tech).","As recently as August 2025, Claude Opus 4.1 was completely unable to perform the task at all; subsequent general model scaling closed that gap (tech).","Cited alongside Epoch AI's MirrorCode benchmark, where models are now completing week-long autonomous programming projects, pointing to a broader jump in long-horizon task capability (tech)."],"sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"airstreet-flux3-0727","scope":"macro","company":"","title":"FLUX 3: from video generation to robot control","url":"https://press.airstreet.com/p/bfl-flux-3","publication":"Air Street Press","source":"RSS","published_at":"2026-07-27 13:23","created_at":"2026-07-28 09:08","sentiment":"positive","analysis":"Black Forest Labs released FLUX 3, an open-weight video-generation backbone being extended toward robot action prediction, pitched as a cheaper source of 'world knowledge' than task-specific robot demonstration data.","opinion":"Air Street Press: open-weighting the backbone could let smaller robotics teams skip expensive demonstration collection and inherit world knowledge from existing video instead.","key_points":["FLUX 3 Video is available in early access now, with image generation/editing and partner access to action-prediction plus an open-weight multimodal backbone to follow (tech).","The frozen-video-backbone approach targets robotics teams' costliest bottleneck: task-specific demonstration data, described as slow and expensive to produce and prone to transferring poorly when the task changes (tech).","Open-weighting the backbone is positioned to let an entire ecosystem of robotics builders draw on shared 'world knowledge' from existing video rather than each collecting their own demonstrations (strategy)."],"sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"damnang-cxmt-memory-0727","scope":"company","company":"Micron Technology, Inc.","title":"After CXMT's Listing, Do the Memory Three Have Further to Fall?","url":"https://damnang2.substack.com/p/after-cxmts-listing-do-the-memory","publication":"Damnang's Substack","source":"RSS","published_at":"2026-07-27 06:19","created_at":"2026-07-28 13:08","sentiment":"positive","sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[["Semis & HW","Memory"]],"plc_or":[],"analysis":"Damnang argues China's CXMT is not closing the DRAM/HBM gap fast enough to threaten Samsung/SK hynix/Micron pricing power.","opinion":"Damnang: CXMT's HBM push raises industry DRAM prices rather than undercutting them — bullish for the incumbent 'Memory Three.'","key_points":["CXMT's 5th-gen DRAM node has slipped to 2H 2026 while incumbents ramp 1c and move to HBM4, widening rather than closing the technology gap (tech).","CXMT allocates less than 2% of wafer starts to HBM; its HBM3 yield is estimated at ~25% vs 70-90% for incumbents Samsung, SK hynix and Micron (financial/tech).","HBM consumes roughly 3x the wafer area of equivalent-capacity DDR5, so CXMT's HBM push pressures ordinary DRAM prices upward, not downward (financial)."]},{"post_id":"linear187-preai-incumbent-0727","scope":"macro","company":"","title":"Linear #187: Pre-AI Software Incumbent? Here Are Your Five Paths Forward, The Story Of Cognite & Their Recent $3B+ Exit","url":"https://www.newsletter.lukesophinos.com/p/linear-186-pre-ai-software-incumbent","publication":"Linear: A Vertical Software & Vertical AI Newsletter","source":"RSS","published_at":"2026-07-27 00:02","created_at":"2026-07-28 13:08","sentiment":"positive","sector":"Vertical SW","sub_sector":"Manufacturing","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"Linear profiles Cognite's recent $3B+ exit as a case study for how pre-AI vertical software incumbents can still find strong outcomes despite AI disruption fears.","opinion":"Linear (Sophinos): Cognite's exit is proof that viable paths exist for pre-AI vertical incumbents — AI disruption fears are overstated for well-positioned data platforms.","key_points":["Cognite's recent exit was valued at $3B+, cited as a marquee outcome for a 'pre-AI' vertical software incumbent (financial).","Piece frames five strategic paths pre-AI vertical incumbents can take to remain relevant against AI-native entrants (market).","Cross-referenced lesson: embedded-payments businesses see merchant adoption plateau post-launch without continued investment — a broader vertical-SaaS monetization pattern (tech/market)."]},{"post_id":"dmg-selloff-0729","scope":"macro","company":"","title":"What Would Stop This Selloff?","url":"https://damnang2.substack.com/p/what-would-stop-this-selloff","publication":"Damnang's Substack","source":"RSS","published_at":"2026-07-29 00:31","created_at":"2026-07-29 07:08","sentiment":"mixed","analysis":"Pushes back on the 'peak GPU'/2028-oversupply selloff thesis by arguing the capex-to-bits conversion math understates HBM's wafer-area cost.","opinion":"Damnang: the 2028-oversupply bear case is overdone once HBM's wafer-area economics are accounted for properly.","key_points":["The market's selloff fear centers on $75B of combined capex at the 'big three' hyperscalers landing as bits in 2028 (financial).","HBM structurally lowers bits shipped per wafer vs. commodity DRAM: 1GB of HBM3E consumes roughly the wafer area of 3GB of commodity DRAM, and the multiple grows with each HBM generation (tech).","The bear case requires three conditions to hold simultaneously: 2028 oversupply already locked in, China's DRAM entry being structural, and hyperscalers losing the ability to keep funding the buildout (analysis)."],"sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[]},{"post_id":"pc-nvidiaamd-rack-0728","scope":"company","company":"NVIDIA Corporation","title":"Same Split, Opposite Directions: Where NVIDIA and AMD Cut the Rack Decides Where Optics Gets Paid","url":"https://photoncap apex depreciation obscure the real cash economics behind Microsoft and Meta's AI spending.","opinion":"The author's stance is bearish — arguing the market ignored valuation discipline through the AI capex buildout and is now facing the reckoning.","key_points":["Companies including Microsoft are adding back billions in stock-based compensation while shareholders absorb the dilution (financial).","Capex leaves the cash-flow statement immediately, but the resulting depreciation burden hits the income statement only gradually — a timing gap the author says flatters near-term profitability (financial).","Management commentary on AI remains confident but offers no breakout of AI-specific revenue, operating profit, or return on invested capital (financial).","Piece frames prior quarters of 'vaporware' framing from AI-optimist commentary as now colliding with P/E-driven valuation pain (market)."]},{"post_id":"semivision-cxmt-ipo-surge-20260728","scope":"macro","company":"","title":"Make China Great Again? CXMT's 466% IPO Surge Signals a New DRAM Power","url":"https://tspasemiconductor.substack.com/p/make-china-great-again-cxmts-466","publication":"SEMIVISION @_@","source":"RSS","published_at":"2026-07-28 11:15","created_at":"2026-07-30 07:46","sentiment":"mixed","sector":"Semis & HW","sub_sector":"Memory","owners":["roy"],"plc_roy":[],"plc_or":[],"analysis":"CXMT's blockbuster Chinese IPO underscores Beijing's push to build a self-sufficient DRAM supply chain — a structural, state-backed competitive backdrop for the Roy watchlist's Memory names (Samsung, SK hynix, Micron).","opinion":"The author frames the listing as the capitalization of a deliberate national memory strategy rather than a speculative pop — a bullish read on China's DRAM ambitions.","key_points":["CXMT's IPO surged 466%, signaling strong investor demand for China's homegrown DRAM champion (financial).","The listing supports China's push to reduce reliance on foreign memory suppliers for AI servers, cloud infrastructure, telecom systems, autos and government computing (market).","Framed as the 'capitalization of China's memory strategy' — part of a broader industrial policy push rather than a one-off financing event (market)."]},{"post_id":"verticalist-vibe-coding-vertical-ai-20260729","scope":"sector","company":"","title":"Vibe Coding Meets Reality in Vertical AI","url":"https://insights.euclid.vc/p/vibe-coding-meets-reality-in-vertical-ai-alex-oppenheimer-verissimo-vc","publication":"The Verticalist","source":"RSS","published_at":"2026-07-29 15:32","created_at":"2026-07-30 07:46","sentiment":"mixed","sector":"Vertical SW","sub_sector":"","owners":["or"],"plc_roy":[],"plc_or":[],"analysis":"A Verissimo Ventures partner argues AI-assisted ('vibe') coding is bifurcating vertical SaaS: prosumer point tools are losing pricing power while complex, enterprise-scale vertical platforms are getting relatively harder to replicate.","opinion":"The guest's stance is that AI is not commoditizing all of vertical SaaS — only its shallow end — while defensible, complex platforms get relatively stronger.","key_points":["Simple, prosumer-facing vertical tools have 'more-or-less lost pricing power altogether' as AI lowers the cost to build discrete, small-scope tools (market).","By contrast, complex enterprise-scalable vertical platforms may have gotten harder to build in the AI era given rising expectations for interoperability and customization (tech).","Frames build times, maintenance costs and unit economics as diverging sharply between the simple and complex ends of vertical software (market)."]},{"post_id":"a16z-building-worlds-train-robots-20260729","scope":"macro","company":"","title":"Building Worlds That Train Robots","url":"https://www.a16z.news/p/building-worlds-that-train-robots","publication":"a16z","source":"RSS","published_at":"2026-07-29 14:01","created_at":"2026-07-30 07:46","sentiment":"positive","sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[],"analysis":"World Labs co-founder Fei-Fei Li argues that simulated 'world models,' not just bigger models or hardware tweaks, are the key unlock for reliable, real-world robot deployment.","opinion":"Li's stance is bullish that spatial-intelligence world models — not incremental robot hardware iteration — will close the gap between lab demos and reliable real-world robot operation.","key_points":["Argues the core bottleneck in robotics is the demo-to-deployment gap: robots must handle shifting objects, clutter, lighting changes and variable physical interactions reliably, not just in controlled demos (tech).","Positions 'spatial intelligence' world-models as the mechanism to train robots at scale without exhaustive, costly real-world trial and error (tech).","Frames this as the next frontier after language-model scaling — extending AI progress from digital cognition into physical-world reliability (market)."]},{"post_id":"pmf-1x-pitch-deck-humanoid-20260729","scope":"macro","company":"","title":"1X Pitch Deck: The Humanoid Backed by OpenAI","url":"https://www.productmarketfit.tech/p/1x-pitch-deck-the-humanoid-backed","publication":"Product Market Fit","source":"RSS","published_at":"2026-07-29 13:28","created_at":"2026-07-30 07:46","sentiment":"positive","sector":"Emerging Tech","sub_sector":"Robotics & Physical AI","owners":["roy"],"plc_roy":[],"plc_or":[],"analysis":"A breakdown of 1X's investor pitch deck for its OpenAI-backed humanoid robot, arguing manual physical labor — not cognitive work — is the next large market automation has yet to touch.","opinion":"The author is bullish on 1X's thesis that safety and real-world deployability, not raw capability alone, are what finally make humanoid robots commercially viable.","key_points":["Frames manual labor — warehouses, security, logistics, facilities, care work — as 'tens of trillions' in annual wage spend still largely untouched by automation, unlike cognitive work already disrupted by software and AI (market).","Positions 1X's general-purpose humanoid robots as differentiated by being safe enough to operate alongside humans and deployable in real environments, addressing robotics' historic failure modes: too rigid, unsafe, expensive, and hard to deploy (tech).","OpenAI-backed 1X is presented as a leading bet that robotics has finally solved the deployment problem that sank prior automation waves (market)."]},{"post_id":"cj-msftmeta-0729","scope":"company","company":"Meta","title":"Q2 26' Earnings Are Blurry for Microsoft & Meta Investors","url":"https://coastaljournal.substack.com/p/q2-26-earnings-are-blurry-for-microsoft","publication":"The Coastal Journal","source":"RSS","published_at":"2026-07-29 23:24","created_at":"2026-07-30 10:46","sentiment":"mixed","analysis":"Same capex/depreciation-opacity critique applied to Meta's Q2 print.","opinion":"Author: investors are being sold an AI narrative without the unit-economics disclosure needed to underwrite it.","key_points":["Capex leaves the cash-flow statement immediately while depreciation is recognized over a multi-year lag, distorting near-term comparisons (financial).","No AI-specific revenue, operating profit, or ROIC breakout is provided despite heavy AI-driven capex guidance (financial)."],"sector":"Vertical SW","sub_sector":"Social Media","owners":["or"],"plc_roy":[],"plc_or":[["Vertical SW","Social Media"]]},{"post_id":"a2r-frontierlabs-0728","scope":"company","company":"Google","title":"Can the US Frontier AI Labs Survive a Price War?","url":"https://ai2roi.substack.com/p/can-the-us-frontier-ai-labs-survive","publication":"AI to ROI","source":"RSS","published_at":"2026-07-28 12:31","created_at":"2026-07-30 10:46","sentiment":"mixed","analysis":"AI to ROI compares the business math of Google's AI business against Anthropic's and OpenAI's spend.","opinion":"Author: Google 'gets a pass' on AI economics because its cloud+AI business is already profitable, unlike the pure-play labs.", const SENT = { positive:"\u{1F7E2} positive", negative:"\u{1F534} negative",
               neutral:"⚪ neutral", mixed:"\u{1F7E1} mixed" };
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let PROFILE = localStorage.getItem("dash_profile") || "roy";
let SCOPE = "";
let PICKED = new Set();
const BRIEFED = new Set(DATA.briefed||[]);
let READ = new Set(JSON.parse(localStorage.getItem("dash_read")||"[]"));
let HIDDEN = new Set(JSON.parse(localStorage.getItem("dash_hidden")||"[]"));
let SHOW_HIDDEN = false;
function saveRead(){ try{ localStorage.setItem("dash_read", JSON.stringify([...READ])); }catch(e){} }
function saveHidden(){ try{ localStorage.setItem("dash_hidden", JSON.stringify([...HIDDEN])); }catch(e){} }
function gkey(h){ return h.post_id ? ("p:"+h.post_id) : ("u:"+(h.url||h.title||"")); }
function updateCount(nRows,nComp,checkedN,hiddenN){
  const c=document.getElementById("count");
  c.innerHTML = `${nRows} briefing${nRows!==1?"s":""} \u00B7 ${nComp} compan${nComp!==1?"ies":"y"} \u00B7 profile: ${PROFILE}`
    + (checkedN?` \u00B7 <a href="#" id="del-checked" class="act">🗑 delete ${checkedN} checked</a>`:"")
    + (hiddenN?` \u00B7 <a href="#" id="toggle-hidden">${SHOW_HIDDEN?"hide":"show"} ${hiddenN} deleted</a> \u00B7 <a href="#" id="clear-hidden">restore all</a>`:"");
}
function bindCountLinks(){
  const d=document.getElementById("del-checked"); if(d) d.onclick=e=>{e.preventDefault(); READ.forEach(k=>HIDDEN.add(k)); READ=new Set(); saveRead(); saveHidden(); render();};
  const t=document.getElementById("toggle-hidden"); if(t) t.onclick=e=>{e.preventDefault(); SHOW_HIDDEN=!SHOW_HIDDEN; render();};
  const c2=document.getElementById("clear-hidden"); if(c2) c2.onclick=e=>{e.preventDefault(); HIDDEN=new Set(); saveHidden(); render();};
}

const selSector = document.getElementById("f-sector"),
      selSub = document.getElementById("f-sub"),
      selPub = document.getElementById("f-pub"),
      inQ = document.getElementById("f-q");
document.getElementById("gen").textContent = DATA.generated;

/* ---- profile routing ---- */
function rowVisible(r){ return PROFILE === "admin" || (r.owners||["roy"]).includes(PROFILE); }
function placements(r){
  if(PROFILE==="roy") return r.plc_roy||[];
  if(PROFILE==="or")  return r.plc_or||[];
  return [...(r.plc_roy||[]), ...(r.plc_or||[])];   // admin
}
function matchSector(r){
  if(!selSector.value) return true;
  if(r.scope!=="company") return r.sector===selSector.value && (!selSub.value || r.sub_sector===selSub.value);
  return placements(r).some(p => p[0]===selSector.value && (!selSub.value || p[1]===selSub.value));
}

/* ---- option builders ---- */
function fillOptions(){
  document.getElementById("profile-title").textContent = {roy:"Roy",or:"Or",admin:"Admin"}[PROFILE];
  const tree = DATA.profiles[PROFILE].tree;
  selSector.innerHTML = '<option value="">All</option>' +
    Object.keys(tree).sort().map(s=>`<option>${esc(s)}</option>`).join("");
  selSub.innerHTML = '<option value="">All</option>'; selSub.disabled = true;
  const pubs=[...new Set(DATA.rows.filter(rowVisible).map(r=>r.publication).filter(Boolean))].sort();
  selPub.innerHTML = '<option value="">All</option>' + pubs.map(p=>`<option>${esc(p)}</option>`).join("");
  buildMsel();
}
selSector.onchange = () => {
  const subs=(DATA.profiles[PROFILE].tree[selSector.value]||[]);
  selSub.innerHTML='<option value="">All</option>'+subs.map(s=>`<option>${esc(s)}</option>`).join("");
  selSub.disabled=!selSector.value; render();
};
selSub.onchange=render; selPub.onchange=render; inQ.oninput=render;

document.getElementById("pswitch").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  PROFILE=b.dataset.p; localStorage.setItem("dash_profile",PROFILE); PICKED=new Set();
  for(const x of e.currentTarget.children) x.classList.toggle("active",x===b);
  fillOptions(); render();
});
document.getElementById("f-scope").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  SCOPE=b.dataset.v||"";
  for(const x of e.currentTarget.children) x.classList.toggle("active",x===b);
  render();
});

/* ---- company multi-select ---- */
const mselBtn=document.getElementById("msel-btn"), mselPanel=document.getElementById("msel-panel"),
      mselList=document.getElementById("msel-list"), mselQ=document.getElementById("msel-q");
mselBtn.onclick=()=>{ mselPanel.style.display = mselPanel.style.display==="none"?"block":"none"; };
document.addEventListener("click", e=>{ if(!document.getElementById("msel").contains(e.target)) mselPanel.style.display="none"; });
document.getElementById("msel-clear").onclick=e=>{ e.preventDefault(); PICKED=new Set(); buildMsel(); render(); };
mselQ.oninput=buildMsel;
function buildMsel(){
  const comps=DATA.profiles[PROFILE].companies, q=(mselQ.value||"").toLowerCase();
  mselList.innerHTML=comps.filter(c=>!q||c.toLowerCase().includes(q)).map(c=>
    `<label><input type="checkbox" value="${esc(c)}" ${PICKED.has(c)?"checked":""}> `+
    `${BRIEFED.has(c)?'<span class="dot">&#9679;</span> ':''}${esc(c)}</label>`).join("");
  mselList.querySelectorAll("input").forEach(cb=>{
    cb.onchange=()=>{ cb.checked?PICKED.add(cb.value):PICKED.delete(cb.value); syncChips(); render(); };
  });
  mselBtn.textContent=PICKED.size?`${PICKED.size} compan${PICKED.size>1?"ies":"y"} selected`:"All companies";
  syncChips();
}
function syncChips(){
  document.getElementById("chips").innerHTML=[...PICKED].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))
    .map(c=>`<span class="chip">${esc(c)} <a data-c="${esc(c)}">&times;</a></span>`).join("");
  document.querySelectorAll("#chips .chip a").forEach(a=>{ a.onclick=()=>{ PICKED.delete(a.dataset.c); buildMsel(); render(); }; });
}

/* ---- filtering ---- */
function filteredRows(){
  return DATA.rows.filter(r=> rowVisible(r)
    && (!SCOPE || r.scope===SCOPE)
    && (!PICKED.size || (r.company && PICKED.has(r.company)))
    && matchSector(r)
    && (!selPub.value || r.publication===selPub.value)
    && (!inQ.value || ((r.title||"")+(r.analysis||"")+(r.opinion||"")+(r.company||""))
         .toLowerCase().includes(inQ.value.toLowerCase())));
}

/* ---- cell renderers ---- */
function companyBlock(r){
  const sent=r.sentiment?`<div class="sent">${SENT[r.sentiment]||esc(r.sentiment)}</div>`:"";
  const tk=(DATA.tickers&&DATA.tickers[r.company])?` (${esc(DATA.tickers[r.company])})`:"";
  return `<div class="grp">${esc(r.company)}${tk}${sent}</div>`;
}
function summaryBlock(r){
  const pts=(r.key_points||[]).map(p=>`<li>${esc(p)}</li>`).join("");
  const body=pts?`<ul>${pts}</ul>`:(r.analysis?`${esc(r.analysis)}`:"");
  return `<div class="grp">${body}${r.opinion?`<div class="op">${esc(r.opinion)}</div>`:""}</div>`;
}
function macroCompanyCell(r){
  const icon=r.scope==="sector"?"\u{1F310}":"\u{1F4CA}";
  const tag=r.scope==="sector"?"sector news":"sub-sector news";
  const name=r.scope==="sector"?r.sector:r.sub_sector;
  return `<span class="macro-label">${icon} ${esc(name)}</span><div class="macro-tag">${tag}</div>`;
}

/* ---- render (groups company rows by post_id) ---- */
function render(){
  const rows=filteredRows();
  const groups=[]; const idx={};
  for(const r of rows){
    const key=(r.scope==="company"&&r.post_id)?("p:"+r.post_id):("u:"+groups.length);
    if(idx[key]===undefined){ idx[key]=groups.length; groups.push([r]); }
    else groups[idx[key]].push(r);
  }
  groups.sort((a,b)=> String(b[0].published_at||"").localeCompare(String(a[0].published_at||"")));
  const hiddenN=groups.filter(g=>HIDDEN.has(gkey(g[0]))).length;
  const shown=SHOW_HIDDEN?groups:groups.filter(g=>!HIDDEN.has(gkey(g[0])));
  const checkedN=shown.filter(g=>READ.has(gkey(g[0]))).length;
  const shownRows=shown.reduce((n,g)=>n+g.length,0);
  const nComp=new Set(shown.flat().filter(r=>r.company).map(r=>r.company)).size;
  updateCount(shownRows,nComp,checkedN,hiddenN);
  if(!shown.length){
    document.getElementById("tbody").innerHTML=
      `<tr><td class="empty" colspan="6">${hiddenN?"All matching posts were deleted \u2014 use \u2018show N deleted\u2019 above to restore.":"No briefings match the current filters."}</td></tr>`;
    bindCountLinks(); return;
  }
  document.getElementById("tbody").innerHTML=shown.map(g=>{
    const head=g[0], macro=head.scope!=="company";
    const compCell = macro ? macroCompanyCell(head) : g.map(companyBlock).join("");
    const sumCell  = macro ? summaryBlock(head)     : g.map(summaryBlock).join("");
    const _k=gkey(head), _rd=READ.has(_k), _hd=HIDDEN.has(_k);
    const _cls=[macro?"macro-row":"", _rd?"read-row":"", _hd?"hidden-row":""].filter(Boolean).join(" ");
    return `<tr${_cls?` class="${_cls}"`:""}>`+
      `<td class="readcell"><input type="checkbox" class="mark-read" data-k="${esc(_k)}" ${_rd?"checked":""} title="Mark as read (strikethrough)"></td>`+
      `<td class="company">${compCell}</td>`+
      `<td class="summary">${sumCell}</td>`+
      `<td>${head.url?`<a href="${esc(head.url)}" target="_blank">${esc(head.title)}</a>`:esc(head.title||"")}</td>`+
      `<td class="published">${esc(head.published_at||"")}</td>`+
      `<td class="account">${esc(head.publication||(head.owners||[]).join(", "))}</td></tr>`;
  }).join("");
  document.querySelectorAll(".mark-read").forEach(cb=>{ cb.onchange=()=>{ const k=cb.dataset.k; cb.checked?READ.add(k):READ.delete(k); saveRead(); render(); }; });
  bindCountLinks();
}

/* ---- CSV export (visible rows) ---- */
document.getElementById("dl").onclick=()=>{
  const rows=filteredRows();
  const head=["post_id","scope","company","ticker","sentiment","title","publication","source","published_at","created_at","sector","sub_sector","owners","analysis","opinion","key_points","url"];
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const lines=[head.join(",")].concat(rows.map(r=>[
    r.post_id,r.scope,r.company,(DATA.tickers&&DATA.tickers[r.company])||r.ticker||"",r.sentiment,r.title,
    r.publication,r.source,r.published_at,r.created_at,r.sector,r.sub_sector,(r.owners||[]).join("|"),
    r.analysis,r.opinion,(r.key_points||[]).join(" | "),r.url
  ].map(q).join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`briefings_${PROFILE}.csv`; a.click();
};

/* ---- init ---- */
document.querySelectorAll("#pswitch button").forEach(b=>b.classList.toggle("active",b.dataset.p===PROFILE));
fillOptions(); render();
</script>
